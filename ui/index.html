<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>NewAPI OpenAI 图像插件</title>
  <link rel="stylesheet" href="../../../plugin-sdk.css">
  <style>
    .api-key-wrapper { position: relative; display: flex; align-items: center; }
    .api-key-wrapper input { flex: 1; padding-right: 36px; }
    .toggle-eye {
      position: absolute; right: 6px;
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 2px 4px; line-height: 1;
    }
    .toggle-eye:hover { color: var(--text-primary); }
    .hint-text { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
    .action-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .action-row button { flex: 1; padding: 7px 0; font-size: 12px; }
    .refresh-btn { flex: 0 0 auto !important; padding: 7px 12px !important; }
    .status-msg { font-size: 11px; margin-top: 6px; min-height: 18px; }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: var(--danger); }
    .status-msg.loading { color: var(--warning); }
    select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .checkbox-control { display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer; }
    .checkbox-control input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border-color); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h3>NewAPI OpenAI 图像插件</h3>
  <p>兼容 OpenAI API 的图像生成插件，支持自定义 API 地址和密钥，自动获取可用模型。</p>
  <hr>

  <!-- API Key -->
  <div class="form-row">
    <label class="form-label">API Key</label>
    <div class="form-control">
      <div class="api-key-wrapper">
        <input type="password" id="apiKeyInput" placeholder="sk-...">
        <button class="toggle-eye" id="toggleEye" type="button">显示</button>
      </div>
    </div>
  </div>

  <!-- Base URL -->
  <div class="form-row">
    <label class="form-label">Base URL</label>
    <div class="form-control">
      <input type="text" id="baseUrlInput" placeholder="https://api.openai.com">
    </div>
  </div>

  <!-- 模型选择 + 刷新按钮 -->
  <div class="form-row">
    <label class="form-label">模型</label>
    <div class="form-control" style="display:flex;gap:6px;">
      <select id="modelSelect" style="flex:1;">
        <option value="">请先配置 URL 和 Key 后获取</option>
      </select>
      <button class="refresh-btn" id="btnRefreshModels" title="从 API 获取模型列表">刷新</button>
    </div>
  </div>
  <div class="status-msg" id="modelStatus"></div>

  <div class="form-row">
    <label class="form-label">图片比例</label>
    <div class="form-control">
      <select id="aspectRatioSelect">
        <option value="1:1">1:1</option>
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="4:3">4:3</option>
        <option value="3:4">3:4</option>
      </select>
    </div>
  </div>

  <!-- 尺寸 -->
  <div class="form-row">
    <label class="form-label">图片尺寸</label>
    <div class="form-control">
      <select id="sizeSelect">
        <option value="1024x1024">1024x1024（方形）</option>
        <option value="1792x1024">1792x1024（宽横屏）</option>
        <option value="1024x1792">1024x1792（宽竖屏）</option>
      </select>
    </div>
  </div>


  <!-- 质量（根据模型动态切换选项） -->
  <div class="form-row" id="qualityRow">
    <label class="form-label">图片质量</label>
    <div class="form-control">
      <select id="qualitySelect">
        <option value="medium">medium（中等）</option>
      </select>
    </div>
  </div>

  <!-- 风格（仅 dall-e-3） -->
  <div class="form-row" id="styleRow">
    <label class="form-label">图片风格</label>
    <div class="form-control">
      <select id="styleSelect">
        <option value="vivid">vivid（生动）</option>
        <option value="natural">natural（自然）</option>
      </select>
    </div>
  </div>


  <!-- 生成数量 -->
  <div class="form-row">
    <label class="form-label">生成数量</label>
    <div class="form-control">
      <select id="nSelect">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
  </div>

  <!-- 返回格式 -->
  <div class="form-row">
    <label class="form-label">返回格式</label>
    <div class="form-control">
      <select id="responseFormatSelect">
        <option value="url">url（返回下载链接）</option>
        <option value="b64_json">b64_json（返回Base64）</option>
      </select>
    </div>
  </div>

  <!-- 超时 -->
  <div class="form-row">
    <label class="form-label">超时(秒)</label>
    <div class="form-control">
      <input type="number" id="timeoutInput" value="300" min="30" max="1800">
    </div>
  </div>

  <div class="form-row">
    <label class="form-label">角色人脸处理</label>
    <div class="form-control">
      <label class="checkbox-control">
        <input type="checkbox" id="faceProcessingToggle" checked>
        <span>自动处理</span>
      </label>
    </div>
  </div>

  <hr>
  <h4>GitHub 自动更新</h4>
  <div class="form-row">
    <label class="form-label">仓库</label>
    <div class="form-control">
      <input type="text" id="updateRepoInput" placeholder="owner/repo">
      <div class="hint-text">填写 GitHub 仓库，例如 liushuai0109001-cell/huiju-openai-image-plugin。</div>
    </div>
  </div>
  <div class="form-row">
    <label class="form-label">更新操作</label>
    <div class="form-control" style="display:flex;gap:6px;flex-wrap:wrap;">
      <button type="button" id="btnCheckUpdate">检查更新</button>
      <button type="button" id="btnApplyUpdate">下载并更新</button>
      <div id="updateStatus" class="hint-text" style="flex-basis:100%;margin-top:2px;"></div>
    </div>
  </div>

  <div class="hint-text">
    兼容 OpenAI / NewAPI 及其他 OpenAI 格式的图像生成 API。<br>
    配置 API Key 和 Base URL 后，点击 <b>刷新</b> 自动获取可用模型列表。<br>
    修改 URL 或 Key 后将自动触发模型列表刷新。
  </div>

  <script src="../../../plugin-sdk.js"></script>
  <script>
    // ===== DOM 元素 =====
    var apiKeyInput = document.getElementById('apiKeyInput');
    var baseUrlInput = document.getElementById('baseUrlInput');
    var modelSelect = document.getElementById('modelSelect');
    var aspectRatioSelect = document.getElementById('aspectRatioSelect');
    var sizeSelect = document.getElementById('sizeSelect');
    var qualitySelect = document.getElementById('qualitySelect');
    var styleSelect = document.getElementById('styleSelect');
    var nSelect = document.getElementById('nSelect');
    var responseFormatSelect = document.getElementById('responseFormatSelect');
    var timeoutInput = document.getElementById('timeoutInput');
    var faceProcessingToggle = document.getElementById('faceProcessingToggle');
    var toggleEye = document.getElementById('toggleEye');
    var btnRefresh = document.getElementById('btnRefreshModels');
    var modelStatus = document.getElementById('modelStatus');
    var qualityRow = document.getElementById('qualityRow');
    var styleRow = document.getElementById('styleRow');
    var updateRepoInput = document.getElementById('updateRepoInput');
    var btnCheckUpdate = document.getElementById('btnCheckUpdate');
    var btnApplyUpdate = document.getElementById('btnApplyUpdate');
    var updateStatus = document.getElementById('updateStatus');

    var _sdkReady = false;
    var _modelList = [];
    var _refreshTimer = null;
    var ASPECT_RATIO_OPTIONS = ['1:1', '16:9', '9:16', '4:3', '3:4'];

    // ===== 尺寸配置 =====
    var SIZE_OPTIONS = {
      'dall-e-2': ['1K'],
      'dall-e-3': ['1K', '2K', '4K'],
      'gpt-image': ['1K', '2K', '4K'],
      'gemini': ['1K', '2K', '4K'],
      'default': ['1K', '2K', '4K'],
    };
    var SIZE_LABELS = {
      '1K': '1K',
      '2K': '2K',
      '4K': '4K',
      '256x256': '256x256（小方形）',
      '512x512': '512x512（中方块）',
      '1024x1024': '1024x1024（方形）',
      '1792x1024': '1792x1024（宽横屏）',
      '1024x1792': '1024x1792（宽竖屏）',
      '1536x1024': '1536x1024（横屏）',
      '1024x1536': '1024x1536（竖屏）',
    };

    // ===== 工具函数 =====
    function setSelectValue(sel, val) {
      if (val == null) return;
      var sv = String(val);
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === sv) {
          sel.selectedIndex = i;
          return;
        }
      }
      // 如果值不在选项中，添加一个临时选项
      if (sv && sel !== modelSelect) {
        var opt = document.createElement('option');
        opt.value = sv;
        opt.textContent = sv;
        sel.appendChild(opt);
        sel.value = sv;
      }
    }

    function getSizeOptionsForModel(model) {
      if (!model) return SIZE_OPTIONS['default'];
      var ml = model.toLowerCase();
      if (ml.indexOf('firefly') !== -1) return ['1K', '2K', '4K'];
      for (var key in SIZE_OPTIONS) {
        if (key === 'default') continue;
        if (ml.indexOf(key) !== -1 || key.indexOf(ml) !== -1) {
          return SIZE_OPTIONS[key];
        }
      }
      return SIZE_OPTIONS['default'];
    }

    function normalizeAspectRatio(value) {
      var raw = String(value || '').trim().toLowerCase().replace(/\s+/g, '').replace('*', 'x').replace('×', 'x');
      if (!raw) return '1:1';
      if (raw.indexOf('16:9') !== -1 || raw.indexOf('16x9') !== -1 || raw.indexOf('landscape') !== -1) return '16:9';
      if (raw.indexOf('9:16') !== -1 || raw.indexOf('9x16') !== -1 || raw.indexOf('portrait') !== -1 || raw.indexOf('vertical') !== -1) return '9:16';
      if (raw.indexOf('4:3') !== -1 || raw.indexOf('4x3') !== -1) return '4:3';
      if (raw.indexOf('3:4') !== -1 || raw.indexOf('3x4') !== -1) return '3:4';
      if (raw.indexOf('1:1') !== -1 || raw.indexOf('1x1') !== -1 || raw.indexOf('square') !== -1) return '1:1';
      var m = raw.match(/(\d{3,5})x(\d{3,5})/);
      if (m) {
        var w = parseInt(m[1], 10), h = parseInt(m[2], 10);
        if (w === h) return '1:1';
        var r = w / Math.max(1, h);
        if (r > 1.55) return '16:9';
        if (r < 0.72) return '9:16';
        return w > h ? '4:3' : '3:4';
      }
      return ASPECT_RATIO_OPTIONS.indexOf(raw) !== -1 ? raw : '1:1';
    }

    function normalizeImageSize(value) {
      var raw = String(value || '').trim().toLowerCase().replace(/\s+/g, '');
      if (raw === '4k' || raw === 'uhd' || raw === 'ultra' || raw === 'high') return '4K';
      if (raw === '2k' || raw === 'hd' || raw === 'medium') return '2K';
      if (raw === '1k' || raw === 'sd' || raw === 'low' || raw === 'standard') return '1K';
      var m = raw.match(/(\d{3,5})x(\d{3,5})/);
      if (m) {
        var longEdge = Math.max(parseInt(m[1], 10), parseInt(m[2], 10));
        if (longEdge >= 3500) return '4K';
        if (longEdge >= 1500) return '2K';
        return '1K';
      }
      return raw === '4' || raw === '4000' || raw === '4096' ? '4K' : raw === '2' || raw === '2000' || raw === '2048' ? '2K' : '1K';
    }

    // 质量选项映射
    var DALL_E_QUALITY = [
      { v: 'standard', t: 'standard（标准）' },
      { v: 'hd', t: 'hd（高清）' },
    ];
    var GPT_IMAGE_QUALITY = [
      { v: 'low', t: 'low（低）' },
      { v: 'medium', t: 'medium（中等）' },
      { v: 'high', t: 'high（高）' },
    ];

    function populateGptImageQualityOptions() {
      var curQ = qualitySelect.value;
      qualitySelect.innerHTML = '';
      GPT_IMAGE_QUALITY.forEach(function (q) {
        var opt = document.createElement('option');
        opt.value = q.v;
        opt.textContent = q.t;
        qualitySelect.appendChild(opt);
      });
      setSelectValue(qualitySelect, (curQ === 'standard' || curQ === 'hd') ? 'medium' : curQ);
    }

    function canUsePerRequestGptQuality(model) {
      var ml = String(model || '').toLowerCase();
      var size = String(sizeSelect.value || '').toUpperCase();
      return (ml.indexOf('firefly') !== -1 || ml.indexOf('gpt-image') !== -1) &&
        (size === '1K' || size === '2K');
    }

    function updateModelSpecificOptions(model) {
      if (!model) return;
      var ml = model.toLowerCase();

      // 质量选项
      if (ml.indexOf('firefly') !== -1) {
        if (canUsePerRequestGptQuality(model)) {
          populateGptImageQualityOptions();
          qualityRow.style.display = '';
        } else {
          qualityRow.style.display = 'none';
        }
        styleRow.style.display = 'none';
      } else if (ml.indexOf('gpt-image') !== -1) {
        if (ml.indexOf('gpt-image-2') !== -1) {
          if (canUsePerRequestGptQuality(model)) {
            populateGptImageQualityOptions();
            qualityRow.style.display = '';
          } else {
            qualityRow.style.display = 'none';
          }
          styleRow.style.display = 'none';
          return;
        }
        // gpt-image: low/medium/high
        if (canUsePerRequestGptQuality(model)) {
          populateGptImageQualityOptions();
          qualityRow.style.display = '';
        } else {
          qualityRow.style.display = 'none';
        }
        styleRow.style.display = 'none';
      } else if (ml.indexOf('dall-e-3') !== -1) {
        // dall-e-3: standard/hd + style
        var curQ2 = qualitySelect.value;
        qualitySelect.innerHTML = '';
        DALL_E_QUALITY.forEach(function (q) {
          var opt = document.createElement('option');
          opt.value = q.v;
          opt.textContent = q.t;
          qualitySelect.appendChild(opt);
        });
        setSelectValue(qualitySelect, (curQ2 === 'low' || curQ2 === 'medium' || curQ2 === 'high') ? 'standard' : curQ2);
        qualityRow.style.display = '';
        styleRow.style.display = '';
      } else {
        // dall-e-2 等其他模型：不发送 quality/style
        qualityRow.style.display = 'none';
        styleRow.style.display = 'none';
      }
    }

    function updateSizeOptions(model) {
      var sizes = getSizeOptionsForModel(model);
      var currentVal = sizeSelect.value;
      sizeSelect.innerHTML = '';
      sizes.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.textContent = SIZE_LABELS[s] || s;
        sizeSelect.appendChild(opt);
      });
      var found = sizes.indexOf(currentVal) !== -1;
      setSelectValue(sizeSelect, found ? currentVal : sizes[0]);

      updateModelSpecificOptions(model);
    }

    function setStatus(msg, cls) {
      modelStatus.textContent = msg || '';
      modelStatus.className = 'status-msg ' + (cls || '');
    }

    // ===== 模型下拉框填充 =====
    function populateModelDropdown(models, defaultModel, currentModel) {
      if (!models || !models.length) return;
      _modelList = models;
      var curVal = currentModel || modelSelect.value;
      modelSelect.innerHTML = '';
      models.forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
      // 恢复之前的选择或使用默认
      if (curVal && models.indexOf(curVal) !== -1) {
        modelSelect.value = curVal;
      } else if (defaultModel && models.indexOf(defaultModel) !== -1) {
        modelSelect.value = defaultModel;
      } else if (models.length > 0) {
        modelSelect.selectedIndex = 0;
      }
      PluginSDK.saveParam('model', modelSelect.value);
      updateSizeOptions(modelSelect.value);
      setStatus('成功获取 ' + models.length + ' 个模型', 'success');
    }

    // ===== 模型刷新 =====
    function refreshModels() {
      var baseUrl = baseUrlInput.value.trim();
      var apiKey = apiKeyInput.value.trim();

      if (!baseUrl) {
        setStatus('请先填写 Base URL', 'error');
        return;
      }

      setStatus('<span class="spinner"></span>正在获取模型列表...', 'loading');
      btnRefresh.disabled = true;
      modelSelect.disabled = true;

      // 发送获取请求
      PluginSDK.sendAction('fetch_models', {
        base_url: baseUrl,
        api_key: apiKey,
        timeout: 15
      });

      // 轮询 getParams() 作为回退机制，读取后端保存到 config 的 model_list
      var pollCount = 0;
      var pollMax = 10;
      var pollInterval = 500;
      (function pollModelList() {
        pollCount++;
        PluginSDK.getParams().then(function (p) {
          if (p && p.model_list) {
            try {
              var models = JSON.parse(p.model_list);
              if (Array.isArray(models) && models.length > 0) {
                btnRefresh.disabled = false;
                modelSelect.disabled = false;
                populateModelDropdown(models, p.model_list_default || '', p.model);
                return;
              }
            } catch (e) {}
          }
          // 如果 pollCount 超限且有 onAction 回调，停止轮询
          if (pollCount < pollMax) {
            setTimeout(pollModelList, pollInterval);
          } else {
            btnRefresh.disabled = false;
            modelSelect.disabled = false;
            setStatus('获取超时，请检查 URL 和 Key 是否正确', 'error');
          }
        }).catch(function () {
          if (pollCount < pollMax) {
            setTimeout(pollModelList, pollInterval);
          } else {
            btnRefresh.disabled = false;
            modelSelect.disabled = false;
            setStatus('获取超时，请检查 URL 和 Key 是否正确', 'error');
          }
        });
      })();
    }

    function scheduleAutoRefresh() {
      if (_refreshTimer) clearTimeout(_refreshTimer);
      _refreshTimer = setTimeout(function () {
        if (_sdkReady) refreshModels();
      }, 800);
    }

    // ===== 事件绑定 =====

    // 眼睛切换
    toggleEye.addEventListener('click', function () {
      if (apiKeyInput.type === 'password') {
        apiKeyInput.type = 'text';
        toggleEye.textContent = '隐藏';
      } else {
        apiKeyInput.type = 'password';
        toggleEye.textContent = '显示';
      }
    });

    // Base URL / API Key 变更时自动刷新模型
    baseUrlInput.addEventListener('input', function () {
      PluginSDK.saveParam('base_url', baseUrlInput.value);
      scheduleAutoRefresh();
    });
    baseUrlInput.addEventListener('change', function () {
      PluginSDK.saveParam('base_url', baseUrlInput.value);
      refreshModels();
    });

    apiKeyInput.addEventListener('change', function () {
      PluginSDK.saveParam('api_key', apiKeyInput.value);
      refreshModels();
    });
    apiKeyInput.addEventListener('blur', function () {
      PluginSDK.saveParam('api_key', apiKeyInput.value);
    });

    // 手动刷新
    btnRefresh.addEventListener('click', refreshModels);

    // 模型变更
    modelSelect.addEventListener('change', function () {
      PluginSDK.saveParam('model', modelSelect.value);
      updateSizeOptions(modelSelect.value);
    });

    aspectRatioSelect.addEventListener('change', function () {
      PluginSDK.saveParam('aspect_ratio', aspectRatioSelect.value);
    });

    // 尺寸变更
    sizeSelect.addEventListener('change', function () {
      PluginSDK.saveParam('size', sizeSelect.value);
      PluginSDK.saveParam('image_size', sizeSelect.value);
      updateModelSpecificOptions(modelSelect.value);
    });

    // 质量变更
    qualitySelect.addEventListener('change', function () {
      PluginSDK.saveParam('quality', qualitySelect.value);
      PluginSDK.saveParam('gpt_image_quality', qualitySelect.value);
    });

    // 风格变更
    styleSelect.addEventListener('change', function () {
      PluginSDK.saveParam('style', styleSelect.value);
    });

    // 数量变更
    nSelect.addEventListener('change', function () {
      PluginSDK.saveParam('n', nSelect.value);
    });

    // 格式变更
    responseFormatSelect.addEventListener('change', function () {
      PluginSDK.saveParam('response_format', responseFormatSelect.value);
    });

    // 超时变更
    timeoutInput.addEventListener('change', function () {
      PluginSDK.saveParam('timeout', parseInt(timeoutInput.value) || 300);
    });

    faceProcessingToggle.addEventListener('change', function () {
      PluginSDK.saveParam('enable_face_processing', faceProcessingToggle.checked);
    });

    // ===== 监听后端动作响应（快速路径） =====
    updateRepoInput.addEventListener('change', function () {
      PluginSDK.saveParam('update_repo', updateRepoInput.value.trim());
    });
    updateRepoInput.addEventListener('blur', function () {
      PluginSDK.saveParam('update_repo', updateRepoInput.value.trim());
    });
    btnCheckUpdate.addEventListener('click', function () {
      updateStatus.textContent = '正在检查更新...';
      PluginSDK.sendAction('check_update', { repo: updateRepoInput.value.trim() });
    });
    btnApplyUpdate.addEventListener('click', function () {
      updateStatus.textContent = '正在下载并更新...';
      PluginSDK.sendAction('apply_update', { repo: updateRepoInput.value.trim() });
    });

    PluginSDK.onAction('fetch_models_result', function (data) {
      btnRefresh.disabled = false;
      modelSelect.disabled = false;
      if (data.ok) {
        populateModelDropdown(data.models || [], data.default_model || '', modelSelect.value);
      } else {
        setStatus('获取失败: ' + (data.error || '未知错误'), 'error');
      }
    });

    // ===== 参数读写 =====
    PluginSDK.onAction('check_update_result', function (data) {
      if (data.ok) {
        updateStatus.textContent = data.has_update
          ? ('发现新版本：' + data.latest_version + '，当前版本：' + data.current_version)
          : (data.message || '已经是最新版本');
      } else {
        updateStatus.textContent = '检查失败：' + (data.error || '未知错误');
      }
    });

    PluginSDK.onAction('apply_update_result', function (data) {
      if (data.ok && data.updated) {
        updateStatus.textContent = '更新完成：' + (data.latest_version || '') + '，已备份到 ' + (data.backup_dir || '');
      } else if (data.ok) {
        updateStatus.textContent = data.message || '已经是最新版本';
      } else {
        updateStatus.textContent = '更新失败：' + (data.error || '未知错误');
      }
    });

    function getParams() {
      return {
        api_key: apiKeyInput.value.trim(),
        base_url: baseUrlInput.value.trim(),
        model: modelSelect.value,
        aspect_ratio: aspectRatioSelect.value,
        size: sizeSelect.value,
        image_size: sizeSelect.value,
        n: nSelect.value,
        quality: qualitySelect.value,
        gpt_image_quality: qualitySelect.value,
        style: styleSelect.value,
        response_format: responseFormatSelect.value,
        timeout: timeoutInput.value,
        enable_face_processing: faceProcessingToggle.checked,
        update_repo: updateRepoInput.value.trim(),
      };
    }

    function setParams(params) {
      if (params.api_key) apiKeyInput.value = params.api_key;
      if (params.base_url) {
        baseUrlInput.value = params.base_url;
      }
      
      // 恢复缓存的模型列表
      if (params.model_list) {
        try {
          var cachedModels = JSON.parse(params.model_list);
          if (Array.isArray(cachedModels) && cachedModels.length > 0) {
            populateModelDropdown(cachedModels, params.model_list_default || '', params.model);
          }
        } catch (e) {}
      }
      
      if (params.model && modelSelect.options.length <= 1 && (!_modelList.length || _modelList.indexOf(params.model) === -1)) {
        // 如果模型列表为空或不包含当前模型，添加为临时选项
        var found = false;
        for (var i = 0; i < modelSelect.options.length; i++) {
          if (modelSelect.options[i].value === params.model) { found = true; break; }
        }
        if (!found && params.model) {
          var opt = document.createElement('option');
          opt.value = params.model;
          opt.textContent = params.model;
          modelSelect.appendChild(opt);
          modelSelect.value = params.model;
        }
      } else if (params.model) {
        setSelectValue(modelSelect, params.model);
      }
      
      if (params.n != null) setSelectValue(nSelect, params.n);
      if (params.gpt_image_quality) setSelectValue(qualitySelect, params.gpt_image_quality);
      else if (params.quality) setSelectValue(qualitySelect, params.quality);
      if (params.style) setSelectValue(styleSelect, params.style);
      if (params.response_format) setSelectValue(responseFormatSelect, params.response_format);
      if (params.timeout != null) timeoutInput.value = params.timeout;
      faceProcessingToggle.checked = params.enable_face_processing == null
        ? true
        : !(params.enable_face_processing === false || String(params.enable_face_processing).toLowerCase() === 'false' || String(params.enable_face_processing) === '0');

      // 更新尺寸选项
      if (params.update_repo != null) updateRepoInput.value = params.update_repo;
      updateSizeOptions(params.model || modelSelect.value);
      setSelectValue(aspectRatioSelect, normalizeAspectRatio(params.aspect_ratio || params.size));
      setSelectValue(sizeSelect, normalizeImageSize(params.image_size || params.size));
      updateModelSpecificOptions(params.model || modelSelect.value);
    }

    window.get_plugin_params = getParams;
    window.set_plugin_params = setParams;

    // ===== SDK 初始化 =====
    if (typeof PluginSDK !== 'undefined' && PluginSDK.onReady) {
      PluginSDK.onReady(function (params) {
        _sdkReady = true;
        setParams(params);
        // 如果有缓存的模型列表就不再自动刷新；否则有 URL 和 Key 就刷新
        if (!params.model_list && params.base_url && params.api_key) {
          scheduleAutoRefresh();
        }
      });
    }

    // ===== 默认初始化 =====
    updateSizeOptions('dall-e-3');
  </script>
</body>
</html>
